name: Build Nix outputs

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rosetta-image:
    name: Rosetta builder image
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        timeout-minutes: 5
        uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            system-features = benchmark big-parallel nixos-test uid-range kvm

      - name: Use Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: rrvsh
          extraPullNames: nix-community,hyprland,yazi
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and publish Rosetta builder image
        timeout-minutes: 120
        run: nix build --print-build-logs .#packages.aarch64-linux.rosetta-builder-image

  linux:
    name: Linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - .#packages.x86_64-linux.site-bin
          - .#packages.x86_64-linux.site-deploy
          - .#nixosConfigurations.hermes.config.system.build.toplevel
          - .#nixosConfigurations.nemesis.config.system.build.toplevel
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        timeout-minutes: 5
        uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Use Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: rrvsh
          extraPullNames: nix-community,hyprland,yazi
          skipPush: true

      - name: Build output
        timeout-minutes: 120
        run: nix build --print-build-logs "${{ matrix.target }}"

  darwin:
    name: Darwin ${{ matrix.target }}
    needs: rosetta-image
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target:
          - .#packages.aarch64-darwin.site-bin
          - .#packages.aarch64-darwin.site-deploy
          - .#darwinConfigurations.alpha.system
          - .#darwinConfigurations.auto.system
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        timeout-minutes: 5
        uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Check runner system
        run: test "$(nix eval --impure --raw --expr builtins.currentSystem)" = aarch64-darwin

      - name: Use Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: rrvsh
          extraPullNames: nix-community,hyprland,yazi
          skipPush: true

      - name: Build output
        timeout-minutes: 120
        run: nix build --print-build-logs "${{ matrix.target }}"
