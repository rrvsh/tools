name: Publish Nix cache

on:
  push:
    branches: [prime]

concurrency:
  group: publish-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rosetta-image:
    name: Rosetta builder image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prime' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        timeout-minutes: 5
        uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            system-features = benchmark big-parallel nixos-test uid-range kvm

      - name: Use Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: rrvsh
          extraPullNames: nix-community,hyprland,yazi
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and publish alpha Rosetta builder image
        timeout-minutes: 120
        run: |
          drv_count="$({
            nix derivation show --recursive .#darwinConfigurations.alpha.system \
              | jq -r '
                .derivations
                | to_entries[]
                | select(.value.system == "aarch64-linux")
                | select(.key | endswith("-nixos-disk-image.drv"))
                | "/nix/store/" + .key
              '
          } | tee /tmp/alpha-rosetta-image-drvs | wc -l)"
          test "$drv_count" -eq 1
          drv="$(cat /tmp/alpha-rosetta-image-drvs)"
          nix build --print-build-logs "$drv"

  linux:
    name: Linux ${{ matrix.target }}
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prime' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - .#packages.x86_64-linux.site-bin
          - .#packages.x86_64-linux.site-deploy
          - .#nixosConfigurations.hermes.config.system.build.toplevel
          - .#nixosConfigurations.nemesis.config.system.build.toplevel
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        timeout-minutes: 5
        uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Use Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: rrvsh
          extraPullNames: nix-community,hyprland,yazi
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and publish output
        timeout-minutes: 120
        run: nix build --print-build-logs "${{ matrix.target }}"

  darwin:
    name: Darwin ${{ matrix.target }}
    needs: rosetta-image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prime' }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target:
          - .#packages.aarch64-darwin.site-bin
          - .#packages.aarch64-darwin.site-deploy
          - .#darwinConfigurations.alpha.system
          - .#darwinConfigurations.auto.system
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        timeout-minutes: 5
        uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Check runner system
        run: test "$(nix eval --impure --raw --expr builtins.currentSystem)" = aarch64-darwin

      - name: Use Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: rrvsh
          extraPullNames: nix-community,hyprland,yazi
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and publish output
        timeout-minutes: 120
        run: nix build --print-build-logs "${{ matrix.target }}"
