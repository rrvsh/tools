name: Daily GitHub automation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run in dry-run mode
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Run GitHub automation controller
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_GH_TOKEN || secrets.GITHUB_TOKEN }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          dry_run_flag=""
          if [ "${DRY_RUN_INPUT}" = "true" ]; then
            dry_run_flag="--dry-run"
          fi

          python3 scripts/github_automation.py \
            --config automation/repos.json \
            --output automation-report.json \
            --summary automation-summary.md \
            ${dry_run_flag}

      - name: Append summary to workflow report
        timeout-minutes: 5
        run: cat automation-summary.md >> "$GITHUB_STEP_SUMMARY"
