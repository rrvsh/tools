name: Run checks and tests

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      workflow: ${{ steps.workflow.outputs.any_changed }}
      gha: ${{ steps.gha.outputs.any_changed }}
      lua: ${{ steps.lua.outputs.any_changed }}
      nix: ${{ steps.nix.outputs.any_changed }}
      rust: ${{ steps.rust.outputs.any_changed }}
      flake: ${{ steps.flake.outputs.any_changed }}

    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Detect workflow changes
        timeout-minutes: 5
        id: workflow
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          files: |
            .github/workflows/check.yaml

      - name: Detect GitHub Actions changes
        timeout-minutes: 5
        id: gha
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          files: |
            .github/**

      - name: Detect Lua changes
        timeout-minutes: 5
        id: lua
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          files: |
            **/*.lua
            .luacheckrc
            .stylua.toml
            stylua.toml

      - name: Detect Nix changes
        timeout-minutes: 5
        id: nix
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          files: |
            **/*.nix
            flake.lock

      - name: Detect Rust changes
        timeout-minutes: 5
        id: rust
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          files: |
            rs/**

      - name: Detect flake input changes
        timeout-minutes: 5
        id: flake
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          files: |
            **/*.nix
            flake.lock
            rs/**

  check-gha:
    needs: changes
    if: ${{ needs.changes.outputs.gha == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        timeout-minutes: 5
        uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          # lets us bypass the rate limiting
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix dependencies
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: Check GitHub Actions workflow files
        run: |
          nix develop .#ci-gha -c just check-gha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # needed for zizmor

  check-lua:
    needs: changes
    if: ${{ needs.changes.outputs.lua == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        timeout-minutes: 5
        uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          # lets us bypass the rate limiting
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix dependencies
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: Check Lua formatting
        run: |
          nix develop .#ci-lua -c just check-lua

  check-nix:
    needs: changes
    if: ${{ needs.changes.outputs.nix == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        timeout-minutes: 5
        uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          # lets us bypass the rate limiting
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix dependencies
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: Check Nix formatting and lint
        run: |
          nix develop .#ci-nix -c just check-nix

  flake-check:
    needs: changes
    if: ${{ needs.changes.outputs.flake == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        timeout-minutes: 5
        uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          # lets us bypass the rate limiting
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix dependencies
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: Run Nix flake checks
        run: |
          nix develop .#ci-nix -c just test-nix

  check-rs:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        timeout-minutes: 5
        uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          # lets us bypass the rate limiting
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix dependencies
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: Cache Cargo dependencies
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            ~/.cache/tools/cargo/.crates.toml
            ~/.cache/tools/cargo/.crates2.json
            ~/.cache/tools/cargo/bin
            ~/.cache/tools/cargo/registry/index
            ~/.cache/tools/cargo/registry/cache
            ~/.cache/tools/cargo/git/db
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust formatting and lint
        run: |
          nix develop .#ci-rs -c just check-rs

  test-rs:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        timeout-minutes: 5
        uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          # lets us bypass the rate limiting
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix dependencies
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: Cache Cargo dependencies
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            ~/.cache/tools/cargo/.crates.toml
            ~/.cache/tools/cargo/.crates2.json
            ~/.cache/tools/cargo/bin
            ~/.cache/tools/cargo/registry/index
            ~/.cache/tools/cargo/registry/cache
            ~/.cache/tools/cargo/git/db
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust tests
        run: |
          nix develop .#ci-rs -c just test-rs

  check:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - changes
      - check-gha
      - check-lua
      - check-nix
      - flake-check
      - check-rs
      - test-rs

    steps:
      - name: Fail if any job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: Check workflow success
        run: |
          echo "All checks passed."
