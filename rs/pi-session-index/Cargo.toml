[package]
name = "pi-session-index"
version = "0.1.0"
edition = "2024"
description = "Fast local metadata index for Pi JSONL sessions"
license = "MIT"
repository = "https://github.com/rrvsh/tools"
readme = false
keywords = ["pi", "session", "index"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rayon = "1.11"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
