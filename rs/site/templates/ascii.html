{% extends "base.html" %}

{% block content %}
<link href="/static/ascii.css" rel="stylesheet" />
<script type="module" src="/static/ascii.js"></script>

<div class="content ascii-page">
  <h1>ASCII art generator</h1>
  <p>turn an image into a fixed-size character canvas. everything stays in your browser.</p>

  <div class="ascii-controls">
    <div class="ascii-field ascii-image-field">
      <label for="ascii-image">Image</label>
      <input id="ascii-image" type="file" accept="image/*">
      <span id="ascii-image-name" class="ascii-help">No image selected.</span>
    </div>

    <div class="ascii-field">
      <label for="ascii-width">Width</label>
      <input id="ascii-width" type="number" min="1" max="300" step="1" value="80" placeholder="e.g. 80">
    </div>

    <div class="ascii-field">
      <label for="ascii-height">Height</label>
      <input id="ascii-height" type="number" min="1" max="300" step="1" value="60" placeholder="e.g. 60">
    </div>

    <div class="ascii-field">
      <label for="ascii-fit">Image fit</label>
      <select id="ascii-fit">
        <option value="fill">Fill</option>
        <option value="fit">Fit</option>
        <option value="stretch">Stretch</option>
      </select>
    </div>

    <div class="ascii-field ascii-charset-field">
      <label for="ascii-charset">Characters, darkest to lightest</label>
      <input id="ascii-charset" type="text" value="@%#*+=-:. " placeholder="e.g. @%#*+=-:. ">
      <span class="ascii-help">Spaces and repeated characters are preserved.</span>
    </div>

    <div class="ascii-field ascii-guide-field">
      <label class="ascii-guide-toggle" for="ascii-guides">
        <input id="ascii-guides" type="checkbox" checked>
        Show row and column guides
      </label>
    </div>
  </div>

  <p id="ascii-error" class="ascii-error" role="alert" hidden></p>
  <p id="ascii-status" class="ascii-status" role="status" aria-live="polite">Choose an image to begin.</p>

  <div class="ascii-actions">
    <button id="ascii-copy" class="button" type="button" disabled>Copy</button>
    <button id="ascii-download" class="button" type="button" disabled>Download .txt</button>
  </div>

  <section class="ascii-output-section" aria-labelledby="ascii-output-heading">
    <h2 id="ascii-output-heading">Preview</h2>
    <div class="ascii-output-frame">
      <pre id="ascii-output" role="img" aria-label="No ASCII art generated yet."></pre>
    </div>
  </section>
</div>
{% endblock %}
