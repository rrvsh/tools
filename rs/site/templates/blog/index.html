{% extends "base.html" %}

{% block content %}
  <h1>blog</h1>
  {% for month in months %}
    <h2>{{ month.label }}</h2>
    <ul>
      {% for article in month.articles %}
        <li><a href="{{ article.url }}">{{ article.title }}</a></li>
      {% endfor %}
    </ul>
  {% endfor %}
{% endblock %}
