{% extends "base.html" %}

{% block content %}
<div class="content">
  <h1>posts</h1>
  <p>a collection of my writing, sorted by month.</p>
  {% for month in months %}
  <h4>{{ month.label }}</h4>
  <ul>
    {% for article in month.articles %}
    <li><a href="{{ article.url }}">{{ article.title }}</a></li>
    {% endfor %}
  </ul>
  {% endfor %}
</div>
{% endblock %}
