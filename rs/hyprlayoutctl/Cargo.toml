[package]
name = "hyprlayoutctl"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Apply named floating layouts to Hyprland workspaces"
readme = "../../README.md"
repository = "https://github.com/rrvsh/tools"
keywords = ["hyprland", "layout", "cli"]
categories = ["command-line-utilities", "config"]

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shellexpand = "3.1.1"
thiserror = "2.0.17"
toml = "0.9.8"

[dev-dependencies]
tempfile = "3.23.0"

[lints.clippy]
correctness = "deny"
suspicious = "deny"
complexity = "deny"
perf = "deny"
style = "deny"
pedantic = "deny"
cargo = "deny"
nursery = "deny"
